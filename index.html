<!DOCTYPE html>
<html>
<head>
    <title>IPC Debugger</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .high-delay { background-color: #ffeb3b !important; }
        .alert { background-color: #f44336 !important; color: white; }
        #analysis { margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; }
        .alert-section { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .warning { background-color: #fff3cd; }
        .alert-item { background-color: #f8d7da; }
    </style>
</head>
<body>

<h1>IPC Debugger Dashboard</h1>

<button id="analyzeBtn" onclick="fetchAnalysis()">Analyze Logs</button>

<table border="1">
    <thead>
        <tr>
            <th>Time</th>
            <th>Sender</th>
            <th>Receiver</th>
            <th>Message</th>
            <th>Delay</th>
        </tr>
    </thead>
    <tbody id="logTable"></tbody>
</table>

<div id="analysis">
    <h2>Analysis</h2>
    <div id="summary"></div>
    <div id="warnings" class="alert-section warning"></div>
    <div id="alerts" class="alert-section alert-item"></div>
</div>

<script src="/static/script.js"></script>

</body>
</html>
